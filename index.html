<!DOCTYPE html>
<html lang="en">

<head>
    <title>OfficialJH's Page</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon created using https://www.favicon.cc/ -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="192x192" href="apple-touch-icon.png">

    <style>
        :root {
            --text: #fff;
            --bg: #222;
            --bg2: #333;
            --bg3: #555;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: "Courier New", Courier, monospace;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 { margin-bottom: 0px }

        a { text-decoration: none }

        button {
            display: flex;
            align-items: center;
            background: var(--bg2);
            border: none;
            color: var(--text);
            gap: 8px;
            cursor: pointer;
            font-size: 1rem;
            font: inherit;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            border-radius: 12px;
            width: 100%;
            height: 48px;
            padding: 8px;
            transition: background 0.2s ease;
        }

        button:hover { background: var(--bg3) }

        button > img { width: 32px }

        .btn-box {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
            gap: 12px;
            background: none;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

    </style>
</head>

<body>
    <img src="./icons/main.png" style="margin-top:16px">
    <h1>OfficialJH's Page</h1>
    <h3>I do stuff sometimes</h3>

    <div class="btn-box">
            <a href="./habit-tracker/">
                <button title="Track them habits">
                    <img src="./icons/habit.png">
                    <span>Habit Tracker</span>
                </button>
            </a>

            <a href="./iptv-player/">
                <button title="Watch IPTV streams online">
                    <img src="./icons/iptv.png">
                    <span>IPTV Player</span>
                </button>
            </a>

            <a href="./mkt-shop-explorer/">
                <button title="For the 5 people that still play this game">
                    <img src="./icons/mkt-shop.png">
                    <span>MKT Shop Explorer</span>
                </button>
            </a>

            <a href="./pit-save-merger/">
                <button title="Honestly I just made this for me">
                    <img src="./icons/pit.png">
                    <span>M&L:PiT Save Merger</span>
                </button>
            </a>

        <div class="btn-row">
            <a href="https://github.com/OfficialJH" target="_blank">
                <button title="My code stinks, please don't look">
                    <img src="./icons/github.png">
                    <span>Github</span>
                </button>
            </a>

            <a href="https://discordapp.com/users/552603874498969602" target="_blank">
                <button title="Just a link to my profile">
                    <img src="./icons/discord.png">
                    <span>Discord</span>
                </button>
            </a>
        </div>
    </div>
</body>

</html>
